[project]
name = "maf-orchestrator"
version = "0.1.0"
description = "Microsoft Agent Framework harness agent, hosted on Foundry, with per-user Entra identity passthrough to Databricks (Genie / Unity Catalog RBAC)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Use the granular sub-packages, NOT the `agent-framework` meta: the meta pulls
    # agent-framework-core[all], which includes agent-framework-azurefunctions -> azure-functions,
    # and azure-functions has no Python 3.13 wheel (breaks the hosted remote build).
    "agent-framework-core>=1.12,<2",   # harness (create_harness_agent), MCPStreamableHTTPTool, history providers
    "agent-framework-foundry",          # agent_framework.foundry.FoundryChatClient
    "agent-framework-foundry-hosting>=1.0.0b260722",  # FoundryToolbox (per-user pass-through toolbox client)
    "mcp>=1.24,<2",                     # runtime for MCP tools
    # Foundry Responses protocol server; we create an AgentSession per request for the harness.
    "azure-ai-agentserver-responses>=1.0.0b9",
    "azure-identity>=1.19",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Used only by scripts/ (Databricks provisioning + smoke tests). Not needed in the container image.
scripts = [
    "azure-ai-projects>=2.3.0",
    "databricks-sdk>=0.40",
    "requests>=2.32",
    "openai>=1.60",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
]

[project.scripts]
maf-orchestrator = "maf_orchestrator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maf_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
package = true
prerelease = "allow"
